name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify versions, tag and changelog
        run: npm run release:verify

  fedora:
    name: Fedora 44 x86_64 packages
    needs: verify
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install Fedora build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make git tar gzip xz \
            webkit2gtk4.1-devel \
            openssl-devel \
            curl wget file \
            libappindicator-gtk3-devel \
            librsvg2-devel \
            libxdo-devel \
            patchelf \
            fuse-libs \
            rpm-build

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
      - name: Run quality and release metadata checks
        run: npm run check && npm run release:verify
      - name: Build RPM and AppImage
        run: npm run release:fedora
      - name: Test install, upgrade, removal and AppImage layout
        run: scripts/smoke-fedora-packages.sh
      - name: Collect artifacts and SHA-256
        run: npm run release:collect:fedora
      - uses: actions/upload-artifact@v4
        with:
          name: gym-${{ github.ref_name }}-fedora-x86_64
          path: release-artifacts/fedora/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [fedora]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: gym-${{ github.ref_name }}-*
          path: downloaded-artifacts
      - name: Prepare release assets and combined checksums
        run: |
          mkdir -p release-assets
          find downloaded-artifacts -type f \( -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} release-assets/ \;
          cd release-assets
          find . -maxdepth 1 -type f \( -name '*.rpm' -o -name '*.AppImage' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --title "Gym $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md
